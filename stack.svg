<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 328" width="1000" height="328" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
:root{--bg:#0b1220;--panel:#0f1a2e;--panel2:#13223b;--line:#1e2d45;--mute:#7d8aa3;--text:#e5e7eb;--acc:#22d3ee;--pur:#aa9bef}
@media (prefers-color-scheme: light){:root{--bg:#ffffff;--panel:#f6f8fa;--panel2:#eef1f5;--line:#d0d7de;--mute:#57606a;--text:#1f2328;--acc:#0e7490;--pur:#6d4fd8}}
.fi{opacity:0;animation:fi .6s ease-out forwards}
.cur{animation:bl 1s steps(1) infinite}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes fi{to{opacity:1}}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
</style>
